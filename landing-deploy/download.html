<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargando Datus...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; }
    </style>
    <!-- Force download headers -->
    <meta http-equiv="Content-Disposition" content="attachment; filename=Datus-v2.1.5.apk">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="text-center px-6">
        <div class="animate-spin text-6xl text-blue-400 mb-6">
            <i class="bi bi-download"></i>
        </div>
        <h1 class="text-2xl font-bold mb-4">Preparando descarga...</h1>
        <p class="text-slate-400 mb-8">Si no comienza automáticamente en 3 segundos:</p>
        
        <!-- Multiple download options for different mobile browsers -->
        <a id="direct-download" href="https://github.com/ADNova-Design/Datus-App/releases/download/v2.1.5/Datus-v2.1.5.apk" 
           class="btn-primary inline-flex items-center gap-3 px-8 py-4 rounded-xl font-bold text-white"
           download="Datus-v2.1.5.apk">
            <i class="bi bi-download text-xl"></i>
            Descargar Datus 2.1.5
        </a>
        
        <div class="mt-8 text-slate-500 text-sm">
            <p>¿Aún no funciona?</p>
            <a href="https://wa.me/5359072053?text=Necesito%20ayuda%20para%20descargar%20Datus" 
               class="text-green-400 underline mt-2 inline-block">
                <i class="bi bi-whatsapp mr-1"></i>Escríbenos por WhatsApp
            </a>
        </div>
    </div>
    
    <script>
        // Auto-redirect after short delay
        setTimeout(function() {
            // Try direct download link for mobile
            const downloadLink = document.getElementById('direct-download');
            
            // For iOS/Safari - try opening in new tab
            if (/iPhone|iPad|iPod/.test(navigator.userAgent) && /Safari/.test(navigator.userAgent)) {
                window.location.href = 'https://github.com/ADNova-Design/Datus-App/releases/download/v2.1.5/Datus-v2.1.5.apk';
            } else {
                // For Android - trigger download
                downloadLink.click();
            }
        }, 1500);
    </script>
</body>
</html>
